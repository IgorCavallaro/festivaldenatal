<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Festival de Natal 2026 · Nova Estação Church</title>
<meta name="description" content="Painel de gestão do Festival de Natal 2026 — Nova Estação Church" />
<meta name="theme-color" content="#1E3A5F" />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<!-- Fonte -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />

<!-- Tailwind (via CDN, sem build step) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React + Babel (permite JSX direto no navegador, sem build) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Ícones -->
<script src="https://unpkg.com/lucide@latest"></script>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { font-family: 'Inter', sans-serif; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="config.js"></script>
  <script type="text/babel" data-presets="react" src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
